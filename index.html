<title>Gemma</title>
<style>:root{color-scheme:dark;--bg:#000;--fg:#fff;--panel:#0d0d12;--soft:#1a1a22;--field:#1f1f29;--line:#2a2a33;--bd:#33333f;--bd2:#44444f;--mut:#888;--card:#16161d;--inv:#fff;--invfg:#000;--accent:#a78bfa;--err:#fca5a5;--ok:#86efac;--navon:#17171d;--c1:#2c2c36}
:root[data-theme="light"]{color-scheme:light;--bg:#f2f2f7;--fg:#14141a;--panel:#f2f2f7;--soft:#e3e3ec;--field:#e8e8f0;--line:#d6d6e0;--bd:#c8c8d4;--bd2:#b8b8c6;--mut:#6b6b78;--card:#dcdce6;--inv:#14141a;--invfg:#fff;--accent:#7c3aed;--err:#dc2626;--ok:#15803d;--navon:#e3e3ec;--c1:#d8d8e2}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,sans-serif;overflow:hidden}
#feed{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
body.side #feed{border-radius:16px}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:var(--card);overflow:hidden}
.card iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
#logo{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;text-align:left;font-size:30px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:20;pointer-events:none}
.info{position:absolute;left:16px;right:96px;bottom:24px;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.name{pointer-events:auto;background:none;border:0;color:#fff;font-size:17px;font-weight:600;padding:4px 0}
.follow{pointer-events:auto;border:1.5px solid #fff;background:rgba(0,0,0,.25);color:#fff;border-radius:20px;padding:5px 14px;font-size:14px;font-weight:600}
.follow.on{background:#fff;color:#000;text-shadow:none}
.title{font-size:20px;font-weight:800;margin-bottom:4px}
.desc{font-size:15px;line-height:1.4}
.tags{font-size:14px;opacity:.85;margin-top:4px}
.like{position:absolute;right:14px;bottom:90px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:30px;width:56px;height:70px;font-size:26px}
.like small{font-size:13px}
.like.on{color:#ff3b5c}
#meta{display:none}
body.side #meta{display:flex;position:fixed;z-index:4;align-items:flex-end;gap:14px;padding-bottom:24px;pointer-events:none}
#meta .like{position:static;flex-shrink:0;margin-bottom:66px;background:var(--soft);pointer-events:auto}
#meta .minfo{flex:1;min-width:0}
body.side .card .info,body.side .card .like{display:none}
.panel{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:80px 30px 30px;font-size:20px;background:var(--panel);z-index:5}
body.side .panel{left:180px;bottom:0}
#profile{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:50px}
#profile>*{flex-shrink:0}
#create{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:50px}
#create>*{flex-shrink:0}
.av{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800}
.pname{font-size:22px;font-weight:700}
.pstat{font-size:16px;opacity:.7}
.chip{background:var(--field);border-radius:14px;padding:10px 18px;font-size:16px}
.panel input,.panel textarea{width:100%;max-width:340px;background:var(--field);border:1px solid var(--bd);border-radius:12px;color:#fff;padding:14px;font-size:16px;outline:none;font-family:inherit}
.panel textarea{resize:none;height:120px}
.abtn{width:100%;max-width:340px;background:#fff;color:#000;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700}
.abtn:disabled{opacity:.5}
.alink{background:none;border:0;color:var(--accent);font-size:15px;padding:6px}
.amsg{min-height:20px;font-size:15px;color:var(--err);max-width:340px}
.amsg.ok{color:var(--ok)}
.field{width:100%;max-width:340px;text-align:left}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;opacity:.85}
.field input,.field textarea{max-width:none}
.count{font-size:12px;opacity:.55;text-align:right;margin-top:4px}
.tagprev{font-size:14px;color:var(--accent);margin-top:6px;min-height:18px}
.thumbrow{display:flex;align-items:center;gap:14px}
.thumbbox{width:72px;height:128px;border-radius:10px;background:var(--field);border:1px dashed var(--bd2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.9;text-align:center;flex-shrink:0}
.thumbbox img{width:100%;height:100%;object-fit:cover}
.pickbtn{background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;display:inline-block}
.card .pw{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:10px;letter-spacing:.8px;color:#fff;opacity:.5;pointer-events:none;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pw b,#pw b{font-weight:700}
body.side .card .pw{display:none}
#pw{display:none}
body.side #pw{display:block;position:fixed;z-index:4;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:1.2px;color:#fff;opacity:.4;pointer-events:none;white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:10}
#nav button{background:none;border:0;color:var(--mut);font-size:28px;width:70px;height:56px;display:flex;align-items:center;justify-content:center}
#nav button.on{color:#fff}
#nav button.plus{background:#fff;color:#000;border-radius:14px;width:56px;height:40px;font-size:26px;font-weight:700}
.ic{display:flex;align-items:center;justify-content:center}
.lb{display:none}
body.side #nav{right:auto;top:64px;bottom:0;width:180px;height:auto;padding:16px 12px 0;border-top:0;border-right:1px solid var(--line);flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px}
body.side #nav button{width:100%;height:52px;justify-content:flex-start;gap:14px;padding:0 10px;border-radius:12px;font-size:28px}
body.side #nav button.on{background:var(--navon)}
body.side #nav button.plus{background:none;color:#fff}
body.side #nav .ic{width:44px;height:32px}
body.side #nav button.plus .ic{background:#fff;color:#000;border-radius:10px;font-size:24px;font-weight:700}
body.side .lb{display:block;font-size:17px;font-weight:600}

body,#nav,.panel{transition:background-color .25s,color .25s,border-color .25s}
[data-theme-btn]{border:0;border-radius:50%;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--fg);flex-shrink:0}
[data-theme-btn] svg{width:20px;height:20px}
#themeM{position:fixed;top:calc(env(safe-area-inset-top) + 52px);left:16px;z-index:20;width:34px;height:34px;background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.onpanel #themeM{background:var(--soft);color:var(--fg)}
body.side #themeM{display:none}
.tbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2}
#nav button#themeS{display:none}

body.side #logo,body.onpanel #logo{color:var(--fg);text-shadow:none}
body.side #pw{color:var(--fg)}
#nav button.on{color:var(--fg)}
#nav button.plus{background:var(--inv);color:var(--invfg)}

body.side #nav button.plus .ic{background:var(--inv);color:var(--invfg)}
.panel input,.panel textarea{color:var(--fg)}
.abtn{background:var(--inv);color:var(--invfg)}
.pickbtn{color:var(--fg)}
.amsg{word-break:break-word}
.pbio{font-size:15px;opacity:.85;max-width:340px;white-space:pre-wrap;word-break:break-word}
.gchip{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;cursor:pointer}
.gchip .gt{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip .gl{opacity:.75;font-size:14px;white-space:nowrap}
.info{color:#fff;right:84px;background:rgba(0,0,0,.32);border-radius:18px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.side #meta .minfo{background:var(--soft);border-radius:20px;padding:16px 18px}
body.side #meta .like{margin-bottom:0;color:var(--fg)}
body.side #meta .like.on{color:#ff3b5c}
body.side #meta .name{color:var(--fg)}
.panel .follow,body.side #meta .follow{border-color:var(--fg);color:var(--fg);background:transparent;text-shadow:none}
.panel .follow.on,body.side #meta .follow.on{background:var(--fg);color:var(--bg)}
body:not(.side) .info{left:10px;right:66px;bottom:8px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.28);backdrop-filter:none;-webkit-backdrop-filter:none}

body:not(.side) .info .name{font-size:13px;padding:2px 0}

body:not(.side) .like small{font-size:11px}
body:not(.side) #logo{font-size:20px;top:calc(env(safe-area-inset-top) + 6px)}

body:not(.side) .card .pw{display:none}
</style>

p.style.cssText="position:fixed;left:"+cx+"px;top:"+cy+"px;font-size:"+(12+Math.random()*20)+"px;line-height:1;color:"+cols[Math.floor(Math.random()*cols.length)]+";pointer-events:none;z-index:99;text-shadow:0 0 10px rgba(255,59,92,.45);will-change:transform,opacity";
document.body.appendChild(p);
var drift=(Math.random()-.5)*90,rise=140+Math.random()*190,sway=8+Math.random()*16,ph=Math.random()*6.28,rot=(Math.random()-.5)*40,fr=[];
for(var k=0;k<=12;k++){
var t=k/12,e=1-(1-t)*(1-t),x=drift*t+Math.sin(ph+t*Math.PI*2.2)*sway*t;
var sc=t<.15?.3+.7*(t/.15):1-(t-.15)*.25,op=t<.1?t/.1:Math.pow(1-(t-.1)/.9,1.3);
fr.push({transform:"translate(calc(-50% + "+x+"px),calc(-50% - "+(rise*e)+"px)) scale("+sc+") rotate("+(rot*t)+"deg)",opacity:op,offset:t});
}
p.animate(fr,{duration:2400+Math.random()*1600,delay:Math.random()*350,easing:"linear",fill:"both"}).onfinish=(function(el2){return function(){el2.remove();};})(p);
}
}
function burstFrom(el,set){
var r=el.getBoundingClientRect();
burst(r.left+r.width/2,r.top+r.height/2,set);
}

function trErr(m){
m=(m||"").toLowerCase();
if(m.indexOf("invalid login")>-1)return "E-posta veya şifre yanlış.";
if(m.indexOf("already")>-1)return "Bu e-posta zaten kayıtlı.";
if(m.indexOf("database error")>-1)return "Bu kullanıcı adı alınmış olabilir, başka bir tane dene.";
if(m.indexOf("password")>-1)return "Şifre en az 6 karakter olmalı.";
if(m.indexOf("rate limit")>-1)return "Çok fazla deneme yapıldı, biraz bekleyip tekrar dene.";
if(m.indexOf("not confirmed")>-1)return "E-postanı doğrulaman gerekiyor.";
if(m.indexOf("valid email")>-1||m.indexOf("invalid email")>-1)return "E-posta adresi geçersiz.";
return "Hata: "+m;
}

function refreshLikes(){
document.querySelectorAll(".like").forEach(function(b){
var id=b.dataset.game;
b.classList.toggle("on",!!likedSet[id]);
b.querySelector("small").textContent=likeCounts[id]||0;
});
}
function refreshFollow(){
document.querySelectorAll(".follow").forEach(function(b){
var on=!!follows[b.dataset.who];
b.classList.toggle("on",on);
b.textContent=on?"Takiptesin":"Takip et";
});
}
function bindFollow(b){
b.onclick=async function(){
if(!me){openProfile("sen");return;}
var who=b.dataset.who;
if(who==me.username){return;}
if(follows[who]){
delete follows[who];refreshFollow();
await sb.from("follows").delete().eq("follower_id",me.id).eq("followed",who);
}else{
follows[who]=true;refreshFollow();
burstFrom(b,["✨","💫","⭐","🤍"]);
await sb.from("follows").insert({follower_id:me.id,followed:who});
}
};
}
async function doLike(g,btn){
if(!me){openProfile("sen");return;}
if(likedSet[g.id]){
delete likedSet[g.id];
likeCounts[g.id]=Math.max(0,(likeCounts[g.id]||1)-1);
if(btn.animate)btn.animate([{transform:"scale(1)"},{transform:"scale(.88)"},{transform:"scale(1)"}],{duration:260,easing:"ease-out"});
refreshLikes();
await sb.from("likes").delete().eq("user_id",me.id).eq("game_id",g.id);
}else{
likedSet[g.id]=true;
likeCounts[g.id]=(likeCounts[g.id]||0)+1;
refreshLikes();
heartBurst(btn);
await sb.from("likes").insert({user_id:me.id,game_id:g.id});
}
}

function renderMeta(g){
var pw=document.getElementById("pw");if(pw)pw.style.visibility=g.file_key?"visible":"hidden";
if(isPhone){return;}
var m=document.getElementById("meta");
m.innerHTML='<button class="like" data-game="'+esc(g.id)+'">♥<br><small>0</small></button>'+
'<div class="minfo"><div class="who"><button class="name">@'+esc(g.creator)+'</button><button class="follow" data-who="'+esc(g.creator)+'">Takip et</button></div>'+
'<div class="title">'+esc(g.title)+'</div><div class="desc">'+esc(g.desc)+'</div><div class="tags">'+esc(g.tags)+'</div></div>';
m.querySelector(".name").onclick=function(){openProfile(g.creator);};
bindFollow(m.querySelector(".follow"));
var lk=m.querySelector(".like");
lk.onclick=function(){doLike(g,lk);};

var feed=document.getElementById("feed");
var profile=document.getElementById("profile");
var create=document.getElementById("create");

var feedObs=[];
function playCard(g,frame){
if(!g.file_key){frame.srcdoc=gameDoc(g);return;}
if(g.project){frame.srcdoc=engineDoc(g.project);return;}
fetch(API+"/files/"+g.file_key).then(function(r){return r.json();}).then(function(p){
g.project=p;
if(frame.isConnected&&frame.parentNode._on)frame.srcdoc=engineDoc(p);
}).catch(function(){});
}
function addCard(g){
var card=document.createElement("div");
card.className="card";
card.innerHTML='<iframe sandbox="allow-scripts"></iframe>'+
'<div class="info"><div class="who"><button class="name">@'+esc(g.creator)+'</button><button class="follow" data-who="'+esc(g.creator)+'">Takip et</button></div>'+
'<div class="title">'+esc(g.title)+'</div><div class="desc">'+esc(g.desc)+'</div><div class="tags">'+esc(g.tags)+'</div></div>'+
'<button class="like" data-game="'+esc(g.id)+'">♥<br><small>0</small></button>'+
(g.file_key?'<div class="pw">powered by <b>gemma engine</b></div>':'');
feed.appendChild(card);
var frame=card.querySelector("iframe"),like=card.querySelector(".like");
card.querySelector(".name").onclick=function(){openProfile(g.creator);};
bindFollow(card.querySelector(".follow"));
like.onclick=function(){doLike(g,like);};
var obs=new IntersectionObserver(function(list){
list.forEach(function(e){
if(e.isIntersecting){card._on=true;playCard(g,frame);renderMeta(g);}
else{card._on=false;frame.srcdoc="";}
});
},{root:feed,threshold:0.6});
obs.observe(card);
feedObs.push(obs);
}
function buildFeed(){
feedObs.forEach(function(o){o.disconnect();});
feedObs=[];
feed.innerHTML="";
games.forEach(addCard);
renderMeta(games[0]);
refreshLikes();
refreshFollow();
}
buildFeed();
async function loadGames(){
var r=await sb.from("games").select("id,creator,title,descr,tags,file_key,thumb_key").order("created_at",{ascending:false}).limit(50);
if(r.error||!r.data)return;
var list=r.data.map(function(x){return {id:x.id,creator:x.creator,title:x.title,desc:x.descr,tags:x.tags,file_key:x.file_key,thumb_key:x.thumb_key};});
games=list.concat(demoGames);
buildFeed();
}
async function delGame(id,btn){
if(!confirm("Bu oyun silinsin mi?"))return;
btn.disabled=true;
try{
var s=(await sb.auth.getSession()).data.session;
if(!s){btn.disabled=false;return;}
var r=await fetch(API+"/games/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+s.access_token}});
if(!r.ok){alert("Silinemedi.");btn.disabled=false;return;}
games=games.filter(function(g){return g.id!=id;});
buildFeed();
openProfile("sen");
}catch(e){alert("Bağlantı hatası.");btn.disabled=false;}
}

function setNav(v){
document.querySelectorAll("#nav button").forEach(function(x){
x.classList.toggle("on",x.dataset.view==v);
});
}
function showView(v){
document.body.classList.toggle("onpanel",v!="feed");
create.style.display=v=="create"?"flex":"none";
profile.style.display=v=="profile"?"flex":"none";
setNav(v);
}

var authMode="giris";
function THB(){return '<button class="tbtn" data-theme-btn>'+GemmaTheme.icon()+'</button>';}
function renderAuth(){
var k=authMode=="kayit";
profile.innerHTML=THB()+'<div class="pname">'+(k?"Hesap oluştur":"Giriş yap")+'</div>'+
'<div class="pstat">Beğenmek, takip etmek ve oyun paylaşmak için</div>'+
(k?'<input id="a_user" placeholder="Kullanıcı adı (harf, rakam, _)" autocapitalize="none" autocorrect="off" maxlength="20">':'')+
'<input id="a_mail" type="email" placeholder="E-posta" autocapitalize="none" autocorrect="off">'+
'<input id="a_pass" type="password" placeholder="Şifre (en az 6 karakter)">'+
'<button class="abtn" id="a_go">'+(k?"Kayıt ol":"Giriş yap")+'</button>'+
'<div class="amsg" id="a_msg"></div>'+
'<button class="alink" id="a_sw">'+(k?"Zaten hesabım var":"Hesabım yok, kayıt ol")+'</button>';
var msg=document.getElementById("a_msg");
document.getElementById("a_sw").onclick=function(){authMode=k?"giris":"kayit";renderAuth();};
document.getElementById("a_go").onclick=async function(){
var btn=document.getElementById("a_go");
var mail=document.getElementById("a_mail").value.trim();
var pass=document.getElementById("a_pass").value;
msg.className="amsg";msg.textContent="";
if(!mail||!pass){msg.textContent="E-posta ve şifreyi yaz.";return;}
btn.disabled=true;
try{
if(k){
var u=document.getElementById("a_user").value.trim().toLowerCase();
if(!/^[a-z0-9_]{3,20}$/.test(u)){msg.textContent="Kullanıcı adı 3-20 karakter olmalı, sadece harf, rakam ve _ kullan.";btn.disabled=false;return;}
var r=await sb.auth.signUp({email:mail,password:pass,options:{data:{username:u}}});
if(r.error){msg.textContent=trErr(r.error.message);btn.disabled=false;return;}
if(!r.data.session){msg.className="amsg ok";msg.textContent="Kayıt oldu. Şimdi giriş yap.";authMode="giris";btn.disabled=false;return;}
}else{
var r2=await sb.auth.signInWithPassword({email:mail,password:pass});
if(r2.error){msg.textContent=trErr(r2.error.message);btn.disabled=false;return;}
}
await loadUser();
await loadSocial();
openProfile("sen");
}catch(e){
msg.textContent="Bağlantı hatası, tekrar dene.";
btn.disabled=false;
}
};
}

function avHtml(name,key,id){
var st=key?' style="background:url('+esc(API+"/files/"+key)+') center/cover"':"";
return '<div class="av"'+(id?' id="'+id+'"':"")+st+'>'+(key?"":esc(name.charAt(0).toUpperCase()))+'</div>';
}
function gchip(g,own){
return '<div class="chip gchip" data-go="'+esc(g.id)+'"><span class="gt">'+esc(g.title)+'</span><span class="gl">♥ '+(likeCounts[g.id]||0)+'</span>'+(own?'<button class="alink" data-del="'+esc(g.id)+'">Sil</button>':'')+'</div>';
}
function goGame(id){
var i=games.findIndex(function(g){return g.id==id;});if(i<0)return;
showView("feed");
feed.scrollTop=i*feed.clientHeight;
}
function bindGo(){profile.querySelectorAll("[data-go]").forEach(function(c){c.onclick=function(){goGame(c.dataset.go);};});}
var BIO_HTML='<div class="field"><label>Hakkında</label><textarea id="bio_in" maxlength="150" placeholder="Kendinden kısaca bahset" style="height:84px"></textarea><div class="count" id="bio_c">0/150</div></div><button class="abtn" id="bio_sv">Kaydet</button><div class="amsg" id="bio_m"></div>';
function bindBio(){
var t=document.getElementById("bio_in");if(!t)return;
var c=document.getElementById("bio_c"),m=document.getElementById("bio_m"),b=document.getElementById("bio_sv");
t.value=me.bio||"";c.textContent=t.value.length+"/150";
t.oninput=function(){c.textContent=t.value.length+"/150";};
b.onclick=async function(){
var v=t.value.trim().slice(0,150);m.className="amsg";m.textContent="";b.disabled=true;
try{
var r=await sb.from("profiles").update({bio:v||null}).eq("id",me.id).select("bio");
if(r.error||!r.data||!r.data.length){m.textContent="Kaydedilemedi."+(r.error?" "+r.error.message:" (UPDATE izni eksik olabilir)");}
else{me.bio=v;m.className="amsg ok";m.textContent="Kaydedildi.";}
}catch(e){m.textContent="Bağlantı hatası.";}
b.disabled=false;
};
}
function openProfile(name){
if(name=="sen"&&!me){renderAuth();showView("profile");return;}
if(me&&name==me.username){name="sen";}
var h="";
if(name=="sen"){
var nl=Object.keys(likedSet).length,nf=Object.keys(follows).length;
var own=games.filter(function(g){return g.file_key&&g.creator==me.username;});
h=THB()+avHtml(me.username,me.avatar_key,"av_me")+'<div class="pname" data-nt>@'+esc(me.username)+'</div>'+
'<div class="pstat">'+nl+' beğeni · '+nf+' takip</div>'+
BIO_HTML+own.map(function(g){return gchip(g,true);}).join("")+
'<button class="alink" id="a_out">Çıkış yap</button>';
profile.innerHTML=h;
profile.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();delGame(b.dataset.del,b);};});
bindGo();bindBio();
document.getElementById("a_out").onclick=async function(){
await sb.auth.signOut();
me=null;likedSet={};follows={};
refreshLikes();refreshFollow();
authMode="giris";
renderAuth();
};
}else{
var mine=games.filter(function(g){return g.creator==name;});
h=THB()+'<div class="av" id="av_o">'+esc(name.charAt(0).toUpperCase())+'</div><div class="pname" data-nt>@'+esc(name)+'</div>'+
'<button class="follow" data-who="'+esc(name)+'">Takip et</button><div class="pbio" id="bio_o"></div><div class="pstat">'+mine.length+' oyun</div>'+
mine.map(function(g){return gchip(g,false);}).join("");
profile.innerHTML=h;
bindFollow(profile.querySelector(".follow"));
bindGo();
refreshFollow();
sb.from("profiles").select("avatar_key,bio").eq("username",name).maybeSingle().then(function(r){
var k=r.data&&r.data.avatar_key,el=document.getElementById("av_o"),bo=document.getElementById("bio_o");
if(bo&&r.data&&r.data.bio&&profile.contains(bo))bo.textContent=r.data.bio;
if(k&&el&&/^avatars\/[a-z0-9-]+\.jpg$/.test(k)&&profile.contains(el)){el.style.background="url("+API+"/files/"+k+") center/cover";el.textContent="";}
});
}
showView("profile");
}

document.querySelectorAll("#nav button[data-view]").forEach(function(b){
b.onclick=function(){
var v=b.dataset.view;
if(v=="profile"){openProfile("sen");}
else if(v=="create"){
if(!me){openProfile("sen");return;}
showView("create");
}
else{showView(v);}
};
});

var draft={thumb:null};
function parseTags(v){
return v.split(/[\s,]+/).filter(Boolean).map(function(t){
return "#"+t.replace(/^#+/,"").replace(/[^\p{L}\p{N}_]/gu,"");
}).filter(function(t){return t.length>1;}).slice(0,5);
}
function bindCounter(inputId,countId,max){
var i=document.getElementById(inputId),c=document.getElementById(countId);
i.addEventListener("input",function(){c.textContent=i.value.length+"/"+max;});
}
bindCounter("c_prompt","c_pc",500);
bindCounter("c_title","c_tc",40);
bindCounter("c_desc","c_dc",120);
document.getElementById("c_tags").addEventListener("input",function(){
document.getElementById("c_tp").textContent=parseTags(this.value).join(" ");
});
document.getElementById("c_go").onclick=function(){
var msg=document.getElementById("c_msg");
var p=document.getElementById("c_prompt").value.trim();
var t=document.getElementById("c_title").value.trim();
msg.className="amsg";
if(p.length<10){msg.textContent="Oyun fikrini biraz daha ayrıntılı yaz (en az 10 karakter).";return;}
if(!t){msg.textContent="Oyuna bir başlık yaz.";return;}
msg.className="amsg ok";
msg.textContent="Bilgilerin hazır. Yapay zeka bağlantısını bir sonraki adımda kuracağız.";
};

async function loadUser(){
var r=await sb.auth.getSession();
var s=r.data.session;
if(s){
var p=await sb.from("profiles").select("username,avatar_key,bio").eq("id",s.user.id).single();
if(p.error)p=await sb.from("profiles").select("username,avatar_key").eq("id",s.user.id).single();
if(p.error)p=await sb.from("profiles").select("username").eq("id",s.user.id).single();
me={id:s.user.id,username:p.data?p.data.username:"kullanici",avatar_key:p.data?p.data.avatar_key:null,bio:p.data&&p.data.bio?p.data.bio:""};
}else{me=null;}
}
async function loadSocial(){
var l=await sb.from("likes").select("user_id,game_id");
likeCounts={};likedSet={};
(l.data||[]).forEach(function(x){
likeCounts[x.game_id]=(likeCounts[x.game_id]||0)+1;
if(me&&x.user_id==me.id){likedSet[x.game_id]=true;}
});
follows={};
if(me){
var f=await sb.from("follows").select("followed").eq("follower_id",me.id);
(f.data||[]).forEach(function(x){follows[x.followed]=true;});
}
refreshLikes();
refreshFollow();
}
(async function(){

try{await loadGames();}catch(e){}
