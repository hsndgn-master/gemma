<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemma</title>
<style>:root{color-scheme:dark;--bg:#000;--fg:#fff;--panel:#0d0d12;--soft:#1a1a22;--field:#1f1f29;--line:#2a2a33;--bd:#33333f;--bd2:#44444f;--mut:#888;--card:#16161d;--inv:#fff;--invfg:#000;--accent:#a78bfa;--err:#fca5a5;--ok:#86efac;--navon:#17171d;--c1:#2c2c36}
:root[data-theme="light"]{color-scheme:light;--bg:#f2f2f7;--fg:#14141a;--panel:#f2f2f7;--soft:#e3e3ec;--field:#e8e8f0;--line:#d6d6e0;--bd:#c8c8d4;--bd2:#b8b8c6;--mut:#6b6b78;--card:#dcdce6;--inv:#14141a;--invfg:#fff;--accent:#7c3aed;--err:#dc2626;--ok:#15803d;--navon:#e3e3ec;--c1:#d8d8e2}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,sans-serif;overflow:hidden}
#feed{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
body.side #feed{border-radius:16px}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:var(--card);overflow:hidden}
.card iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
#logo{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;text-align:left;font-size:30px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:20;pointer-events:none}
.info{position:absolute;left:16px;right:96px;bottom:24px;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.name{pointer-events:auto;background:none;border:0;color:#fff;font-size:17px;font-weight:600;padding:4px 0}
.follow{pointer-events:auto;border:1.5px solid #fff;background:rgba(0,0,0,.25);color:#fff;border-radius:20px;padding:5px 14px;font-size:14px;font-weight:600}
.follow.on{background:#fff;color:#000;text-shadow:none}
.title{font-size:20px;font-weight:800;margin-bottom:4px}
.desc{font-size:15px;line-height:1.4}
.tags{font-size:14px;opacity:.85;margin-top:4px}
.like{position:absolute;right:14px;bottom:90px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:30px;width:56px;height:70px;font-size:26px}
.like small{font-size:13px}
.like.on{color:#ff3b5c}
#meta{display:none}
body.side #meta{display:flex;position:fixed;z-index:4;align-items:flex-end;gap:14px;padding-bottom:24px;pointer-events:none}
#meta .like{position:static;flex-shrink:0;margin-bottom:66px;background:var(--soft);pointer-events:auto}
#meta .minfo{flex:1;min-width:0}
body.side .card .info,body.side .card .like{display:none}
.panel{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:80px 30px 30px;font-size:20px;background:var(--panel);z-index:5}
body.side .panel{left:180px;bottom:0}
#profile{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:50px}
#profile>*{flex-shrink:0}
#create{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:50px}
#create>*{flex-shrink:0}
.av{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800}
.pname{font-size:22px;font-weight:700}
.pstat{font-size:16px;opacity:.7}
.chip{background:var(--field);border-radius:14px;padding:10px 18px;font-size:16px}
.panel input,.panel textarea{width:100%;max-width:340px;background:var(--field);border:1px solid var(--bd);border-radius:12px;color:#fff;padding:14px;font-size:16px;outline:none;font-family:inherit}
.panel textarea{resize:none;height:120px}
.abtn{width:100%;max-width:340px;background:#fff;color:#000;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700}
.abtn:disabled{opacity:.5}
.alink{background:none;border:0;color:var(--accent);font-size:15px;padding:6px}
.amsg{min-height:20px;font-size:15px;color:var(--err);max-width:340px}
.amsg.ok{color:var(--ok)}
.field{width:100%;max-width:340px;text-align:left}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;opacity:.85}
.field input,.field textarea{max-width:none}
.count{font-size:12px;opacity:.55;text-align:right;margin-top:4px}
.tagprev{font-size:14px;color:var(--accent);margin-top:6px;min-height:18px}
.thumbrow{display:flex;align-items:center;gap:14px}
.thumbbox{width:72px;height:128px;border-radius:10px;background:var(--field);border:1px dashed var(--bd2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.9;text-align:center;flex-shrink:0}
.thumbbox img{width:100%;height:100%;object-fit:cover}
.pickbtn{background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;display:inline-block}
.card .pw{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:10px;letter-spacing:.8px;color:#fff;opacity:.5;pointer-events:none;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pw b,#pw b{font-weight:700}
body.side .card .pw{display:none}
#pw{display:none}
body.side #pw{display:block;position:fixed;z-index:4;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:1.2px;color:#fff;opacity:.4;pointer-events:none;white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:10}
#nav button{background:none;border:0;color:var(--mut);font-size:28px;width:70px;height:56px;display:flex;align-items:center;justify-content:center}
#nav button.on{color:#fff}
#nav button.plus{background:#fff;color:#000;border-radius:14px;width:56px;height:40px;font-size:26px;font-weight:700}
.ic{display:flex;align-items:center;justify-content:center}
.lb{display:none}
body.side #nav{right:auto;top:64px;bottom:0;width:180px;height:auto;padding:16px 12px 0;border-top:0;border-right:1px solid var(--line);flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px}
body.side #nav button{width:100%;height:52px;justify-content:flex-start;gap:14px;padding:0 10px;border-radius:12px;font-size:28px}
body.side #nav button.on{background:var(--navon)}
body.side #nav button.plus{background:none;color:#fff}
body.side #nav .ic{width:44px;height:32px}
body.side #nav button.plus .ic{background:#fff;color:#000;border-radius:10px;font-size:24px;font-weight:700}
body.side .lb{display:block;font-size:17px;font-weight:600}

body,#nav,.panel{transition:background-color .25s,color .25s,border-color .25s}
[data-theme-btn]{border:0;border-radius:50%;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--fg);flex-shrink:0}
[data-theme-btn] svg{width:20px;height:20px}
#themeM{position:fixed;top:calc(env(safe-area-inset-top) + 52px);left:16px;z-index:20;width:34px;height:34px;background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.onpanel #themeM{background:var(--soft);color:var(--fg)}
body.side #themeM{display:none}
.tbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:2}
#nav button#themeS{display:none}
body.side #nav button#themeS{display:flex;margin-top:auto;margin-bottom:16px;width:44px;height:44px;padding:0;border-radius:50%;background:var(--soft);color:var(--fg);justify-content:center}
body.side #logo,body.onpanel #logo{color:var(--fg);text-shadow:none}
body.side #pw{color:var(--fg)}
#nav button.on{color:var(--fg)}
#nav button.plus{background:var(--inv);color:var(--invfg)}
body.side #nav button.plus{background:none;color:var(--fg)}
body.side #nav button.plus .ic{background:var(--inv);color:var(--invfg)}
.panel input,.panel textarea{color:var(--fg)}
.abtn{background:var(--inv);color:var(--invfg)}
.pickbtn{color:var(--fg)}
.amsg{word-break:break-word}
.pbio{font-size:15px;opacity:.85;max-width:340px;white-space:pre-wrap;word-break:break-word}
.gchip{display:flex;align-items:center;gap:10px;width:100%;max-width:340px;cursor:pointer}
.gchip .gt{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip .gl{opacity:.75;font-size:14px;white-space:nowrap}
.info{color:#fff;right:84px;background:rgba(0,0,0,.32);border-radius:18px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.side #meta .minfo{background:var(--soft);border-radius:20px;padding:16px 18px}
body.side #meta .like{margin-bottom:0;color:var(--fg)}
body.side #meta .like.on{color:#ff3b5c}
body.side #meta .name{color:var(--fg)}
.panel .follow,body.side #meta .follow{border-color:var(--fg);color:var(--fg);background:transparent;text-shadow:none}
.panel .follow.on,body.side #meta .follow.on{background:var(--fg);color:var(--bg)}
body:not(.side) .info{left:10px;right:66px;bottom:8px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.28);backdrop-filter:none;-webkit-backdrop-filter:none}
body:not(.side) .info .who{gap:8px;margin-bottom:1px}
body:not(.side) .info .name{font-size:13px;padding:2px 0}
body:not(.side) .info .follow{padding:2px 10px;font-size:12px}
body:not(.side) .info .title{font-size:14px;margin-bottom:0}
body:not(.side) .info .desc{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
body:not(.side) .info .tags{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body:not(.side) .like{right:8px;bottom:12px;width:44px;height:56px;font-size:20px;background:rgba(0,0,0,.35)}
body:not(.side) .like small{font-size:11px}
body:not(.side) #logo{font-size:20px;top:calc(env(safe-area-inset-top) + 6px)}
body:not(.side) #themeM{top:calc(env(safe-area-inset-top) + 34px);width:28px;height:28px}
body:not(.side) #themeM svg{width:16px;height:16px}
body:not(.side) .card .pw{display:none}
.card.promo{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;background:linear-gradient(160deg,#4c1d95,#be185d);color:#fff}
.promo i{position:absolute;font-style:normal;font-size:40px;opacity:.85;animation:pbob 3s ease-in-out infinite}
@keyframes pbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.promo h2{margin:0;font-size:30px;font-weight:900;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.35);z-index:1}
.promo p{margin:0;font-size:16px;line-height:1.4;max-width:280px;opacity:.92;z-index:1}
.promo .pbtn{background:#fff;color:#000;border:0;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:800;z-index:1;margin-top:6px}
#navAdmin{display:none!important}
body.side #nav button#navAdmin.show{display:flex!important}
.vb{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-left:.3em;flex-shrink:0}
#admin{justify-content:flex-start;align-items:stretch;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:60px;text-align:left}
#admin>*{flex-shrink:0}
.aw{width:100%;max-width:760px;margin:0 auto;font-size:16px}
.aw .pname,.aw .pstat{text-align:left}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.astat{background:var(--soft);border-radius:14px;padding:12px}
.an{font-size:26px;font-weight:800}.al{font-size:13px;opacity:.7}
.acard{background:var(--soft);border-radius:16px;padding:14px;margin-top:14px}
.acard h3{margin:0 0 8px;font-size:16px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.arow2{display:flex;gap:8px;align-items:center}
.arow2 input{flex:1;min-width:0;max-width:none}
.asm{background:var(--inv);color:var(--invfg);border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.asm.d{background:#dc2626;color:#fff}.asm.g{background:var(--field);color:var(--fg);padding:6px 10px}
.promo .phint{position:absolute;left:0;right:0;bottom:18px;font-size:13px;opacity:.75;z-index:1}
/* ---- Logo (PNG) ---- */
#logo .lg{height:40px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
#logo .lg-l{display:none}
body:not(.side) #logo .lg{height:26px}
body.side #logo .lg,body.onpanel #logo .lg{filter:none}
:root[data-theme="light"] body.side #logo .lg-l,:root[data-theme="light"] body.onpanel #logo .lg-l{display:block}
:root[data-theme="light"] body.side #logo:has(.lg-l) .lg-d,:root[data-theme="light"] body.onpanel #logo:has(.lg-l) .lg-d{display:none}
/* ---- Yasal: onay kutusu ve linkler ---- */
.tos{display:flex;align-items:flex-start;gap:10px;width:100%;max-width:340px;text-align:left;font-size:14px;line-height:1.45;cursor:pointer}
.panel .tos input{width:22px;height:22px;max-width:none;padding:0;margin:1px 0 0;border-radius:6px;flex-shrink:0;accent-color:var(--accent)}
.tos a{color:var(--accent)}
.lgl{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-top:6px}
.lgl a{color:var(--fg);opacity:.7}
/* ---- Report ---- */
.rep{background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rep svg{width:20px;height:20px}
.card .rep{position:absolute;right:11px;bottom:12px;z-index:3}
body.side .card .rep{display:none}
body:not(.side) .like{bottom:58px}
.acol{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;pointer-events:auto}
body.side #meta .rep{background:var(--soft);color:var(--fg);pointer-events:auto}
#navRep{display:none!important}
body.side #nav button#navRep.show{display:flex!important}
#reported{justify-content:flex-start;align-items:stretch;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:60px;text-align:left}
#reported>*{flex-shrink:0}
.rname{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--fg);font-size:15px;font-weight:600;padding:6px 0;text-decoration:underline}
.rbtns{display:flex;gap:6px;flex-shrink:0}
#rview{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.rvbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(env(safe-area-inset-top) + 12px)}
.rvbar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rvbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 0 16px}
.rvbox iframe{height:100%;aspect-ratio:9/16;max-width:100%;border:0;border-radius:16px;background:#000}
#gdlg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:gdf .18s ease-out}
#gdlg.gd-out{opacity:0;transition:opacity .14s}
.gd-card{width:100%;max-width:340px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:26px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:gdp .24s cubic-bezier(.2,.9,.3,1.2)}
.gd-ic{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:var(--field);color:var(--accent);display:flex;align-items:center;justify-content:center}
.gd-ic svg{width:30px;height:30px}
.gd-msg{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:20px;word-break:break-word}
.gd-btns{display:flex;gap:10px}
.gd-b{flex:1;border:0;border-radius:14px;padding:13px 10px;font-size:16px;font-weight:700;font-family:inherit}
.gd-c{background:var(--field);color:var(--fg)}
.gd-ok{background:var(--inv);color:var(--invfg)}
.gd-ok.gd-d{background:#dc2626;color:#fff}
@keyframes gdf{from{opacity:0}to{opacity:1}}
@keyframes gdp{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
/* ---- Kayıt akışı (çok adımlı) ---- */
.suav{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(124,58,237,.35);animation:suin .5s cubic-bezier(.2,.9,.3,1.2)}
.suav svg{width:50px;height:50px}
@keyframes suin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.sut{font-size:26px;font-weight:800;line-height:1.2;animation:sufade .4s ease-out}
.sus{font-size:14px;opacity:.65;max-width:300px;line-height:1.4;margin-top:-6px}
@keyframes sufade{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.susec{width:100%;max-width:340px;text-align:left;margin-top:8px}
.susec .sl{font-size:17px;font-weight:700;margin-bottom:8px}
.susec textarea{height:92px!important}
.skip{background:none;border:0;color:var(--fg);opacity:.55;font-size:13px;padding:6px 0 0;text-decoration:underline;display:block;margin:2px auto 0}
.throw{display:flex;gap:12px;width:100%;max-width:340px}
.thm{flex:1;background:none;border:2px solid var(--bd);border-radius:18px;padding:8px;color:var(--fg);font-size:14px;font-weight:700;font-family:inherit;display:flex;flex-direction:column;gap:8px;align-items:stretch;transition:border-color .2s,transform .15s}
.thm:active{transform:scale(.97)}
.thm.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,.25)}
.thp{height:84px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 14px;border:1px solid rgba(128,128,128,.35)}
.thp i{display:block;height:7px;border-radius:4px}
.thp.d{background:#000}.thp.d i{background:#d8d8e0}.thp.d i+i{background:#55555f}
.thp.l{background:#fff}.thp.l i{background:#26262e}.thp.l i+i{background:#b4b4c0}
.sunext{margin-top:10px}
.abtn.sub{opacity:.45;transition:opacity .25s,box-shadow .25s}
.abtn.sub.ready{opacity:1;animation:suglow 1.6s ease-in-out infinite}
@keyframes suglow{0%,100%{box-shadow:0 0 0 0 rgba(167,139,250,.0),0 0 12px rgba(167,139,250,.45)}50%{box-shadow:0 0 0 6px rgba(167,139,250,.18),0 0 28px rgba(167,139,250,.85)}}
.suback{align-self:flex-start;background:none;border:0;color:var(--fg);opacity:.7;font-size:15px;padding:6px 0;max-width:340px;width:100%;text-align:left}
</style>
<script src="/i18n.js?v=5"></script>
<script src="/theme.js?v=5"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="logo"><img class="lg lg-d" src="/logo.png?v=1" alt="Gemma" onerror="this.replaceWith(document.createTextNode('Gemma'))"><img class="lg lg-l" src="/logo-light.png?v=1" alt="" onerror="this.remove()"></div>
<button id="themeM" data-theme-btn></button>
<div id="feed"></div>
<div id="meta"></div>
<div id="pw">powered by <b>gemma engine</b></div>
<div class="panel" id="create">
<button class="tbtn" data-theme-btn></button>
<div class="pname">Oyun oluştur</div>
<div class="field">
<label>Oyun fikrin (prompt)</label>
<textarea id="c_prompt" maxlength="500" placeholder="Örn: Neon renkli bir uzayda küpleri toplayan 3D bir top oyunu"></textarea>
<div class="count" id="c_pc">0/500</div>
</div>
<div class="field">
<label>Başlık</label>
<input id="c_title" maxlength="40" placeholder="Oyunun adı">
<div class="count" id="c_tc">0/40</div>
</div>
<div class="field">
<label>Açıklama</label>
<input id="c_desc" maxlength="120" placeholder="Oyun hakkında kısa bir cümle">
<div class="count" id="c_dc">0/120</div>

for(var k=0;k<=12;k++){

async function admCall(path,method,body){
var ss=(await sb.auth.getSession()).data.session;
if(!ss)throw new Error("Giriş gerekli.");
var r=await fetch(API+path,{method:method||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ss.access_token},body:body?JSON.stringify(body):undefined});
var j={};try{j=await r.json();}catch(e){}

}
function fmtB(b){return b<1048576?Math.round(b/1024)+" KB":(b/1048576).toFixed(1)+" MB";}
function stat(n,l){return '<div class="astat"><div class="an">'+n+'</div><div class="al">'+l+'</div></div>';}
function bars(vals,labels){
var W=300,H=100,mx=Math.max.apply(null,vals.concat([1])),bw=W/vals.length;
var s='<svg viewBox="0 0 '+W+' '+(H+16)+'" style="width:100%;height:170px">';
vals.forEach(function(v,i){var h=Math.round(v/mx*(H-14));
s+='<rect x="'+(i*bw+2)+'" y="'+(H-h)+'" width="'+(bw-4)+'" height="'+h+'" rx="3" fill="var(--accent)"/>';
if(v)s+='<text x="'+(i*bw+bw/2)+'" y="'+(H-h-3)+'" font-size="9" text-anchor="middle" fill="var(--fg)">'+v+'</text>';});
s+='<text x="2" y="'+(H+12)+'" font-size="9" fill="var(--mut)">'+labels[0]+'</text><text x="'+(W-2)+'" y="'+(H+12)+'" font-size="9" text-anchor="end" fill="var(--mut)">'+labels[labels.length-1]+'</text></svg>';
return s;
}
function hbars(rows){
var mx=Math.max.apply(null,rows.map(function(r){return r[1];}).concat([1]));
return rows.map(function(r){return '<div style="margin:8px 0"><div class="arow" style="border:0;padding:0"><span>'+r[0]+'</span><b>'+fmtB(r[1])+'</b></div><div style="height:8px;border-radius:4px;background:var(--field)"><div style="height:8px;border-radius:4px;background:var(--accent);width:'+Math.max(1,Math.round(r[1]/mx*100))+'%"></div></div></div>';}).join("");
}

if(!r.ok){gNote(L("Oyun açılamadı.","Could not open the game."));return;}
var p=await r.json();
var o=document.createElement("div");
o.id="rview";
o.innerHTML='<div class="rvbar"><b data-nt>'+esc(title)+'</b><button class="asm" id="rv_x">'+L("Kapat","Close")+'</button></div><div class="rvbox"><iframe sandbox="allow-scripts"></iframe></div>';
document.body.appendChild(o);
o.querySelector("iframe").srcdoc=engineDoc(p);
o.querySelector("#rv_x").onclick=function(){o.remove();};
}catch(e){gNote(L("Bağlantı hatası.","Connection error."));}
}
repP.onclick=async function(e){
var b=e.target.closest("button");if(!b)return;
var x=b.dataset;
if(b.id=="rp_ref"){loadReported();return;}
if(x.play){viewGame(x.play,x.pt||"");return;}
var id=x.block||x["false"];
if(!id)return;
var blk=!!x.block;
if(blk&&!(await gDlg({msg:L("Bu oyun engellensin mi? Admin olmayan herkesin erişimine kapanır ve akıştan kaldırılır.","Block this game? It will be closed to everyone except admins and removed from the feed."),ok:"Block",cancel:L("Vazgeç","Cancel"),danger:true})))return;
b.disabled=true;
try{
await admCall("/admin/report-action","POST",{game_id:id,action:blk?"block":"false"});
if(blk){games=games.filter(function(g){return g.id!=id;});buildFeed();}
await loadReported();
}catch(err){b.disabled=false;gNote(window.t(err.message));}
};

var draft={thumb:null};
function parseTags(v){
return v.split(/[\s,]+/).filter(Boolean).map(function(t){
return "#"+t.replace(/^#+/,"").replace(/[^\p{L}\p{N}_]/gu,"");
}).filter(function(t){return t.length>1;}).slice(0,5);
}
function bindCounter(inputId,countId,max){
var i=document.getElementById(inputId),c=document.getElementById(countId);
i.addEventListener("input",function(){c.textContent=i.value.length+"/"+max;});
}
bindCounter("c_prompt","c_pc",500);
bindCounter("c_title","c_tc",40);
bindCounter("c_desc","c_dc",120);
document.getElementById("c_tags").addEventListener("input",function(){
document.getElementById("c_tp").textContent=parseTags(this.value).join(" ");
});
document.getElementById("c_go").onclick=function(){
var msg=document.getElementById("c_msg");
var p=document.getElementById("c_prompt").value.trim();
var t=document.getElementById("c_title").value.trim();
msg.className="amsg";
if(p.length<10){msg.textContent="Oyun fikrini biraz daha ayrıntılı yaz (en az 10 karakter).";return;}
if(!t){msg.textContent="Oyuna bir başlık yaz.";return;}
msg.className="amsg ok";
msg.textContent="Bilgilerin hazır. Yapay zeka bağlantısını bir sonraki adımda kuracağız.";
};

async function loadUser(){
var r=await sb.auth.getSession();
var s=r.data.session;
if(s){
var p=await sb.from("profiles").select("username,avatar_key,bio,role,banned").eq("id",s.user.id).single();
if(p.error)p=await sb.from("profiles").select("username,avatar_key,bio").eq("id",s.user.id).single();
if(p.error)p=await sb.from("profiles").select("username,avatar_key").eq("id",s.user.id).single();
if(p.error)p=await sb.from("profiles").select("username").eq("id",s.user.id).single();
me={id:s.user.id,username:p.data?p.data.username:"kullanici",avatar_key:p.data?p.data.avatar_key:null,bio:p.data&&p.data.bio?p.data.bio:"",role:(p.data&&p.data.role)||null};
if(p.data&&p.data.banned){await sb.auth.signOut();me=null;alert("Bu hesap banlandı.");}
}else{me=null;}
updateAdminNav();
}
async function loadSocial(){
var l=await sb.from("likes").select("user_id,game_id");
likeCounts={};likedSet={};
(l.data||[]).forEach(function(x){
likeCounts[x.game_id]=(likeCounts[x.game_id]||0)+1;
if(me&&x.user_id==me.id){likedSet[x.game_id]=true;}
});
follows={};
if(me){
var f=await sb.from("follows").select("followed").eq("follower_id",me.id);
(f.data||[]).forEach(function(x){follows[x.followed]=true;});
}
refreshLikes();
refreshFollow();
}
(async function(){
try{await loadUser();}catch(e){}
try{await loadGames();}catch(e){}
try{await loadSocial();}catch(e){}
})();
document.querySelector("#nav .plus").onclick=function(){
if(!me){openProfile("sen");return;}
location.href="/editor.html";
};
