<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemma</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden}
#feed{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#16161d;overflow:hidden}
.card iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
#logo{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;text-align:left;font-size:30px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:20;pointer-events:none}
.info{position:absolute;left:16px;right:96px;bottom:24px;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.name{pointer-events:auto;background:none;border:0;color:#fff;font-size:17px;font-weight:600;padding:4px 0}
.follow{pointer-events:auto;border:1.5px solid #fff;background:rgba(0,0,0,.25);color:#fff;border-radius:20px;padding:5px 14px;font-size:14px;font-weight:600}
.follow.on{background:#fff;color:#000;text-shadow:none}
.title{font-size:20px;font-weight:800;margin-bottom:4px}
.desc{font-size:15px;line-height:1.4}
.tags{font-size:14px;opacity:.85;margin-top:4px}
.like{position:absolute;right:14px;bottom:90px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:30px;width:56px;height:70px;font-size:26px}
.like small{font-size:13px}
.like.on{color:#ff3b5c}
.panel{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:80px 30px 30px;font-size:20px;background:#0d0d12;z-index:5}
.av{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800}
.pname{font-size:22px;font-weight:700}
.pstat{font-size:16px;opacity:.7}
.chip{background:#1f1f29;border-radius:14px;padding:10px 18px;font-size:16px}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid #2a2a33;display:flex;align-items:center;justify-content:space-around;z-index:10}
#nav button{background:none;border:0;color:#888;font-size:28px;width:70px;height:56px}
#nav button.on{color:#fff}
#nav button.plus{background:#fff;color:#000;border-radius:14px;width:56px;height:40px;font-size:26px;font-weight:700}
</style>
</head>
<body>
<div id="logo">Gemma</div>
<div id="feed"></div>
<div class="panel" id="create">Oyun oluşturma ekranı<br>yakında burada olacak</div>
<div class="panel" id="profile"></div>
<div id="nav">
<button class="on" data-view="feed">⌂</button>
<button class="plus" data-view="create">+</button>
<button data-view="profile">☺</button>
</div>
<script>
var games=[
{title:"Balon Patlat",creator:"gemma",desc:"Balonlar kaçmadan hepsini patlat!",tags:"#refleks #kolay",
css:`body{background:#1e3a8a}#s{position:absolute;top:110px;left:50%;transform:translateX(-50%);font-size:52px;z-index:5}.b{position:absolute;bottom:-70px;width:64px;height:64px;border-radius:50%;animation:up 3.5s linear forwards}@keyframes up{to{bottom:105%}}`,
body:`<div id="s">0</div>`,
js:`var s=0,sc=document.getElementById("s");
function spawn(){var b=document.createElement("div");b.className="b";b.style.left=(Math.random()*80+5)+"%";b.style.background="hsl("+Math.random()*360+",80%,60%)";b.onclick=function(){s++;sc.textContent=s;b.remove();};document.body.appendChild(b);setTimeout(function(){b.remove();},3500);}
setInterval(spawn,700);`},
{title:"Refleks Testi",creator:"ayse_oyun",desc:"Ekran yeşile dönünce olabildiğince hızlı dokun.",tags:"#refleks #hız",
css:`body{display:flex;align-items:center;justify-content:center;background:#1e3a8a;text-align:center;font-size:30px;padding:20px}`,
body:`<div id="t">Başlamak için dokun</div>`,
js:`var t=document.getElementById("t"),state=0,start=0,timer;
document.body.onclick=function(){
if(state==0){state=1;t.textContent="Bekle...";document.body.style.background="#7f1d1d";timer=setTimeout(function(){state=2;start=Date.now();document.body.style.background="#15803d";t.textContent="ŞİMDİ DOKUN!";},1000+Math.random()*3000);}
else if(state==1){clearTimeout(timer);state=0;document.body.style.background="#1e3a8a";t.textContent="Çok erken! Tekrar dokun";}
else{state=0;document.body.style.background="#1e3a8a";t.textContent=(Date.now()-start)+" ms. Tekrar dokun";}
};`},
{title:"10 Saniye Dokunma",creator:"mertcan",desc:"10 saniyede kaç kez dokunabilirsin?",tags:"#hız #rekor",
css:`body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#4c1d95;text-align:center;padding:20px}#c{font-size:90px}#m{font-size:22px}`,
body:`<div id="c">0</div><div id="m">Başlamak için dokun</div>`,
js:`var n=0,on=false,done=false,c=document.getElementById("c"),m=document.getElementById("m");
document.body.onclick=function(){
if(done){n=0;done=false;c.textContent=0;m.textContent="Başlamak için dokun";return;}
if(!on){on=true;m.textContent="10 saniyen var!";setTimeout(function(){on=false;done=true;m.textContent="Süre bitti! "+n+" dokunuş. Tekrar için dokun";},10000);}
n++;c.textContent=n;
};`}
];

function gameDoc(g){
return '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}'+g.css+'</style></head><body>'+g.body+'<scr'+'ipt>'+g.js+'</scr'+'ipt></body></html>';
}

function burst(x,y,set){
for(var i=0;i<16;i++){
var p=document.createElement("div");
p.textContent=set[Math.floor(Math.random()*set.length)];
p.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;font-size:"+(16+Math.random()*16)+"px;pointer-events:none;z-index:99;";
document.body.appendChild(p);
var dx=(Math.random()-0.5)*170,dy=-(70+Math.random()*150),dur=1300+Math.random()*900;
var a=p.animate([
{transform:"translate(-50%,-50%) scale(.4)",opacity:0},
{transform:"translate(calc(-50% + "+(dx*0.4)+"px),calc(-50% + "+(dy*0.4)+"px)) scale(1.1)",opacity:1,offset:0.25},
{transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(.8)",opacity:0}
],{duration:dur,easing:"cubic-bezier(.2,.7,.3,1)",delay:Math.random()*150,fill:"both"});
a.onfinish=(function(el){return function(){el.remove();};})(p);
}
}
function burstFrom(el,set){
var r=el.getBoundingClientRect();
burst(r.left+r.width/2,r.top+r.height/2,set);
}

var follows={};
function refreshFollow(){
document.querySelectorAll(".follow").forEach(function(b){
var on=!!follows[b.dataset.who];
b.classList.toggle("on",on);
b.textContent=on?"Takiptesin":"Takip et";
});
}
function bindFollow(b){
b.onclick=function(){
var who=b.dataset.who;
follows[who]=!follows[who];
refreshFollow();
if(follows[who]){burstFrom(b,["✨","💫","⭐","🤍"]);}
};
}

var feed=document.getElementById("feed");
var profile=document.getElementById("profile");
var create=document.getElementById("create");

games.forEach(function(g){
var card=document.createElement("div");
card.className="card";
card.innerHTML='<iframe sandbox="allow-scripts"></iframe>'+
'<div class="info"><div class="who"><button class="name" data-who="'+g.creator+'">@'+g.creator+'</button><button class="follow" data-who="'+g.creator+'">Takip et</button></div>'+
'<div class="title">'+g.title+'</div><div class="desc">'+g.desc+'</div><div class="tags">'+g.tags+'</div></div>'+
'<button class="like">♥<br><small>0</small></button>';
feed.appendChild(card);
var frame=card.querySelector("iframe"),like=card.querySelector(".like"),likes=0;
card.querySelector(".name").onclick=function(){openProfile(g.creator);};
bindFollow(card.querySelector(".follow"));
like.onclick=function(){
if(like.classList.contains("on")){like.classList.remove("on");likes--;}
else{like.classList.add("on");likes++;burstFrom(like,["💗","💖","💕","✨"]);}
like.querySelector("small").textContent=likes;
};
new IntersectionObserver(function(list){
list.forEach(function(e){
if(e.isIntersecting){frame.srcdoc=gameDoc(g);}
else{frame.srcdoc="";}
});
},{root:feed,threshold:0.6}).observe(card);
});

function setNav(v){
document.querySelectorAll("#nav button").forEach(function(x){
x.classList.toggle("on",x.dataset.view==v);
});
}
function showView(v){
create.style.display=v=="create"?"flex":"none";
profile.style.display=v=="profile"?"flex":"none";
setNav(v);
}
function openProfile(name){
var mine=games.filter(function(g){return g.creator==name;});
var h='<div class="av">'+name.charAt(0).toUpperCase()+'</div><div class="pname">@'+name+'</div>';
if(name!="sen"){
h+='<button class="follow" data-who="'+name+'">Takip et</button><div class="pstat">'+mine.length+' oyun</div>';
h+=mine.map(function(g){return '<div class="chip">'+g.title+'</div>';}).join("");
}else{
h+='<div class="pstat">Giriş ve profil yakında burada olacak</div>';
}
profile.innerHTML=h;
var fb=profile.querySelector(".follow");
if(fb){bindFollow(fb);}
refreshFollow();
showView("profile");
}

document.querySelectorAll("#nav button").forEach(function(b){
b.onclick=function(){
var v=b.dataset.view;
if(v=="profile"){openProfile("sen");}
else{showView(v);}
};
});
</script>
</body>
</html>
