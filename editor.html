.main{flex:1;display:flex;min-height:0}

.side{flex:1;overflow-y:auto;padding:10px 14px 40px;min-width:0}

.emo button{background:var(--field);border:2px solid transparent;border-radius:10px;font-size:26px;padding:6px 10px}
.emo button.on{border-color:var(--fg)}
.rule{background:var(--soft);border-radius:14px;padding:12px;margin:10px 0}
.rt{font-weight:700;margin-bottom:6px}
.act{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.hint{font-size:13px;opacity:.6;margin:12px 0 6px}
.lock .side,.lock #pub,.lock #back{pointer-events:none;opacity:.35}
#sp{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:50;display:none;flex-direction:column}

.tools{flex:1 1 260px;max-width:420px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tb button{background:var(--field);border:2px solid transparent;color:var(--fg);border-radius:10px;padding:9px 11px;font-size:15px}
.tb button.on{border-color:var(--fg)}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd2)}
@media(max-width:700px){.main{flex-direction:column}.pv{padding:6px}#stage{height:38vh}}
#pb{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 60px}
.pbody>div{max-width:420px;margin:0 auto}
.pf{margin-top:14px}
.pf label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;opacity:.85}

.pc{font-size:12px;opacity:.55;text-align:right;margin-top:4px}
.ptp{font-size:14px;color:var(--accent);margin-top:6px;min-height:18px}
.pth{display:flex;align-items:center;gap:14px}

.pick{background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;display:inline-block}
.amsg{min-height:20px;font-size:15px;color:var(--err);margin-top:12px}
.amsg.ok{color:var(--ok)}

.emo button{color:var(--fg)}
.tb2{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb2 svg{width:20px;height:20px}
summary{cursor:pointer;font-size:15px}
.sub{margin:6px 0 4px 4px;border-left:3px solid var(--bd2);padding-left:8px}
.mrow{background:var(--field);border-radius:10px;padding:6px 8px;margin:6px 0}
.row input[type=range]{flex:1;min-width:0;padding:0;border:0;background:none}
.act .btn.sm,.rule>.btn.sm{margin-top:6px}
body{transition:background-color .25s,color .25s}

}catch(e){setCl("☁ Bağlantı yok");}
}
async function cloudDel(id){
clearTimeout(pend[id]);delete pend[id];
var a=getDel();a.push(id);setDel(a);
var s=await sess();if(!s)return;
try{
var r=await fetch(API+"/drafts/"+encodeURIComponent(id),{method:"DELETE",headers:{Authorization:"Bearer "+s.access_token}});
if(r.ok)setDel(getDel().filter(function(x){return x!=id;}));
}catch(e){}
}
async function syncDrafts(){
if(syncing)return;syncing=true;
try{
var s=await sess();if(!s)return;
var uid=s.user.id,ow=null;
try{ow=localStorage.getItem(OWN_K);}catch(e){}
if(ow&&ow!=uid){P=[];setDel([]);lsSave();}
try{localStorage.setItem(OWN_K,uid);}catch(e){}
var H={Authorization:"Bearer "+s.access_token};
var dl=getDel(),left=[];
for(var i=0;i<dl.length;i++){
try{var rd=await fetch(API+"/drafts/"+encodeURIComponent(dl[i]),{method:"DELETE",headers:H});if(!rd.ok)left.push(dl[i]);}catch(e){left.push(dl[i]);}
}
setDel(left);
var r=await fetch(API+"/drafts",{headers:H});
if(!r.ok)return;
var items=(await r.json()).items||[],seen={},changed=false;
for(var k=0;k<items.length;k++){
var it=items[k];
if(left.indexOf(it.id)>-1)continue;
seen[it.id]=1;
var loc=P.filter(function(x){return x.id==it.id;})[0];
if(loc&&loc===cur&&$("ed").style.display=="flex")continue;
if(!loc||(loc.ut||0)<it.ut){
var g=await fetch(API+"/drafts/"+encodeURIComponent(it.id),{headers:H});
if(!g.ok)continue;
var np=await g.json();np.ut=it.ut;
if(loc)P[P.indexOf(loc)]=np;else P.push(np);
changed=true;
}else if((loc.ut||0)>it.ut){pushDraft(it.id);}
}
P.forEach(function(p){
if(!seen[p.id]&&left.indexOf(p.id)<0){if(!p.ut){p.ut=Date.now();changed=true;}pushDraft(p.id);}
});
if(changed){lsSave();if($("ed").style.display!="flex")showList();}
}catch(e){}
finally{syncing=false;}
}

/* ---- Çizim editörü ---- */
var cv=$("cv"),cx=cv.getContext("2d"),tool="pen",hist=[],snap=null,st=null,spTarget=null;
var TOOLS=[["pen","✏️ Kalem"],["eraser","🧽 Silgi"],["fill","🪣 Boya"],["line","╱ Çizgi"],["circle","◯ Daire"],["rect","▢ Kare"],["rrect","▢ Yuvarlak kare"]];
var PAL=["#000000","#ffffff","#ff3b5c","#ff9500","#ffd60a","#34c759","#00c7be","#0a84ff","#5e5ce6","#bf5af2","#a2845e","#8e8e93"];
function toolBtns(){$("tb").innerHTML=TOOLS.map(function(t){return '<button data-tool="'+t[0]+'" class="'+(t[0]==tool?"on":"")+'">'+t[1]+'</button>';}).join("");}
toolBtns();
$("tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;tool=b.dataset.tool;toolBtns();};
$("pal").innerHTML=PAL.map(function(c){return '<button data-c="'+c+'" style="background:'+c+'"></button>';}).join("");
$("pal").onclick=function(e){var b=e.target.closest("button");if(b)$("co").value=b.dataset.c;};
$("sz").oninput=function(){$("szv").textContent=this.value;};
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*128,y:(e.clientY-r.top)/r.height*128};}
function pushH(){hist.push(cx.getImageData(0,0,128,128));if(hist.length>25)hist.shift();}
function setup(){var c=$("co").value,s=+$("sz").value;cx.globalCompositeOperation=tool=="eraser"?"destination-out":"source-over";cx.strokeStyle=c;cx.fillStyle=c;cx.lineWidth=s;cx.lineCap="round";cx.lineJoin="round";return s;}
function stroke(a,b){var s=setup();cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();if(a.x==b.x&&a.y==b.y){cx.beginPath();cx.arc(a.x,a.y,s/2,0,7);cx.fill();}}
function rr(x,y,w,h,r){cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function shape(a,b){
setup();var x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y),fl=$("fl").checked;
cx.beginPath();
if(tool=="line"){cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();return;}
if(tool=="circle")cx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);
else if(tool=="rect")cx.rect(x,y,w,h);
else rr(x,y,w,h,Math.min(w,h)*0.25);
if(fl)cx.fill();else cx.stroke();
}
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function flood(px,py){
var W=128,sx=Math.floor(px),sy=Math.floor(py);if(sx<0||sy<0||sx>=W||sy>=W)return;
var id=cx.getImageData(0,0,W,W),d=id.data,i0=(sy*W+sx)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=rgb($("co").value);
function near(i,q){return Math.abs(d[i]-q[0])+Math.abs(d[i+1]-q[1])+Math.abs(d[i+2]-q[2])+Math.abs(d[i+3]-q[3])<60;}
if(t[3]==255&&near(i0,c))return;
var seen=new Uint8Array(W*W),stack=[sy*W+sx];
while(stack.length){
var p=stack.pop();if(seen[p])continue;seen[p]=1;
var i=p*4;if(!near(i,t))continue;
d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
var x=p%W,y=(p-x)/W;
if(x>0)stack.push(p-1);if(x<W-1)stack.push(p+1);if(y>0)stack.push(p-W);if(y<W-1)stack.push(p+W);
}
cx.putImageData(id,0,0);
}
cv.onpointerdown=function(e){
e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}
var p=pos(e);pushH();
if(tool=="fill"){flood(p.x,p.y);return;}
st=p;snap=cx.getImageData(0,0,128,128);
if(tool=="pen"||tool=="eraser")stroke(p,p);
};
cv.onpointermove=function(e){
if(!st)return;var p=pos(e);
if(tool=="pen"||tool=="eraser"){stroke(st,p);st=p;}
else{cx.putImageData(snap,0,0);shape(st,p);}
};
cv.onpointerup=cv.onpointercancel=function(){st=null;snap=null;};
$("sp_u").onclick=function(){if(hist.length)cx.putImageData(hist.pop(),0,0);};
$("sp_c").onclick=function(){pushH();cx.clearRect(0,0,128,128);};
$("sp_x").onclick=function(){$("sp").style.display="none";};
function openSp(id){
spTarget=id||null;hist=[];st=null;cx.globalCompositeOperation="source-over";cx.clearRect(0,0,128,128);
if(id&&cur.sprites[id]){var im=new Image();im.onload=function(){cx.drawImage(im,0,0,128,128);};im.src=cur.sprites[id];}
$("sp").style.display="flex";
}
$("sp_ok").onclick=function(){
var d=cx.getImageData(0,0,128,128).data,x0=128,y0=128,x1=-1,y1=-1;
for(var y=0;y<128;y++)for(var x=0;x<128;x++)if(d[(y*128+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
if(x1<0){alert("Önce bir şey çiz.");return;}
var w=x1-x0+1,h=y1-y0+1,s=Math.max(w,h),c=document.createElement("canvas");
c.width=c.height=s;
c.getContext("2d").drawImage(cv,x0,y0,w,h,(s-w)/2,(s-h)/2,w,h);
var url=c.toDataURL("image/png");
if(spTarget){cur.sprites[spTarget]=url;}
else{var sid="s"+cur.nsp++;cur.sprites[sid]=url;var o={id:cur.nid++,sp:sid,e:"🖼️",x:50,y:50,s:20,r:0,drag:false};cur.objects.push(o);sel=o.id;}
$("sp").style.display="none";
sv();stage();panel();
};
showList();
syncDrafts();
document.addEventListener("visibilitychange",function(){if(document.hidden)flushAll();});
