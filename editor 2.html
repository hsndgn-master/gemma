<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gemma Editör</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d12;color:#fff;font-family:-apple-system,sans-serif}
button,select,input{font:inherit}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #2a2a33}
.bar b{flex:1;font-size:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{background:#fff;color:#000;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.btn.g{background:#1f1f29;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:17px;margin-top:12px}
.in{padding:16px;max-width:560px;margin:0 auto}
.card{display:flex;align-items:center;gap:10px;background:#1a1a22;border-radius:14px;padding:14px;margin-top:10px}
.card span{flex:1;font-weight:600;padding:6px 0}
#ed{height:100%;display:none;flex-direction:column}
.main{flex:1;display:flex;min-height:0}
.pv{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:10px}
#stage{position:relative;overflow:hidden;border-radius:14px;height:min(72vh,680px);aspect-ratio:9/16}
.side{flex:1;overflow-y:auto;padding:10px 14px 40px;min-width:0}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;background:#1f1f29;border:0;color:#aaa;border-radius:10px;padding:10px}
.tab.on{background:#fff;color:#000;font-weight:700}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row label{width:110px;font-size:14px;opacity:.8;flex-shrink:0}
.row input[type=number],.row input[type=text],.row select{flex:1;min-width:0;background:#1f1f29;border:1px solid #33333f;border-radius:10px;color:#fff;padding:10px}
.row input[type=color]{width:60px;height:40px;border:0;background:none}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{background:#1f1f29;border:2px solid transparent;border-radius:10px;font-size:26px;padding:6px 10px}
.emo button.on{border-color:#fff}
.rule{background:#1a1a22;border-radius:14px;padding:12px;margin:10px 0}
.rt{font-weight:700;margin-bottom:6px}
.act{border-top:1px solid #2a2a33;padding-top:8px;margin-top:8px}
.hint{font-size:13px;opacity:.6;margin:12px 0 6px}
.lock .side,.lock #pub,.lock #back{pointer-events:none;opacity:.35}
#sp{position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0d12;z-index:50;display:none;flex-direction:column}
.sbody{flex:1;display:flex;gap:14px;padding:12px;min-height:0;overflow:auto;flex-wrap:wrap;justify-content:center;align-content:flex-start}
#cv{width:min(80vw,58vh,440px);height:min(80vw,58vh,440px);border-radius:12px;touch-action:none;background-color:#1f1f29;background-image:conic-gradient(#2c2c36 25%,#1f1f29 0 50%,#2c2c36 0 75%,#1f1f29 0);background-size:20px 20px}
.tools{flex:1 1 260px;max-width:420px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tb button{background:#1f1f29;border:2px solid transparent;color:#fff;border-radius:10px;padding:9px 11px;font-size:15px}
.tb button.on{border-color:#fff}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid #44444f}
@media(max-width:700px){.main{flex-direction:column}.pv{padding:6px}#stage{height:38vh}}
</style></head><body>
<div id="list"><div class="bar"><button class="btn g" id="home">←</button><b>Projelerim</b><button class="btn" id="new">+ Yeni proje</button></div><div class="in" id="pl"></div></div>
<div id="ed"><div class="bar"><button class="btn g" id="back">←</button><b id="pn"></b><button class="btn g" id="mode"></button><button class="btn" id="pub">Yayınla</button></div>
<div class="main"><div class="pv"><div id="stage"></div></div>
<div class="side"><div class="tabs"><button class="tab" data-tab="obj">Nesneler</button><button class="tab" data-tab="rul">Kurallar</button></div><div id="panel"></div></div></div></div>
<div id="sp">
<div class="bar"><button class="btn g" id="sp_x">İptal</button><b>Çizim</b><button class="btn" id="sp_ok">Kaydet</button></div>
<div class="sbody">
<canvas id="cv" width="128" height="128"></canvas>
<div class="tools">
<div class="tb" id="tb"></div>
<div class="row"><label>Kalınlık</label><input type="range" id="sz" min="1" max="30" value="6" style="flex:1"><span id="szv" style="width:24px">6</span></div>
<div class="row"><label>Renk</label><input type="color" id="co" value="#ff3b5c"><label style="width:auto"><input type="checkbox" id="fl" checked> Dolu şekil</label></div>
<div class="pal" id="pal"></div>
<div class="tb"><button id="sp_u">↶ Geri al</button><button id="sp_c">Temizle</button></div>
</div></div></div>
<script src="/engine.js"></script>
<script>
var K="gemma_projects",P=[],cur=null,sel=null,mode="edit",tab="obj",ctrl=null;
var EM=["😀","🐱","🐶","⭐","🍎","🚀","👾","💎","🎈","🌙","🔥","🦊","🪨","🏆","🎯","❤️"];
var WH=[["start","Oyun başlayınca"],["tapany","Ekrana dokunulunca"],["tap","Nesneye dokunulunca"],["touch","Nesne başka nesneye değince"],["edge","Nesne kenara değince"],["always","Sürekli (her an)"],["every","Her … saniyede"],["after","… saniye sonra (bir kez)"]];
var CD=[["none","Her zaman"],["score","Skor"],["life","Can"]];
var OP=[[">","büyükse"],["<","küçükse"],["=","eşitse"]];
var DO=[["move","Taşı"],["forward","İleri git (dönüş yönünde)"],["goto","Şu konuma git"],["gotap","Dokunulan yere git"],["jump","Rastgele yere git"],["rotate","Döndür"],["grow","Büyüt / küçült (%)"],["hide","Gizle"],["show","Göster"],["score","Skor ekle"],["life","Can ekle (eksi = azalt)"],["win","Oyunu kazan"],["lose","Oyunu kaybet"]];
var OBJ=["move","forward","goto","gotap","jump","rotate","grow","hide","show"];
try{P=JSON.parse(localStorage.getItem(K))||[];}catch(e){P=[];}
function $(i){return document.getElementById(i);}
function sv(){try{
P.forEach(function(p){if(!p.sprites)return;var u={};p.objects.forEach(function(o){if(o.sp)u[o.sp]=1;});Object.keys(p.sprites).forEach(function(k){if(!u[k])delete p.sprites[k];});});
localStorage.setItem(K,JSON.stringify(P));
}catch(e){if(!sv.w){sv.w=1;alert("Kayıt için yer kalmadı. Bazı projeleri silmen gerekebilir.");}}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fo(id){return cur.objects.filter(function(o){return o.id==id;})[0];}
function isSp(o){return !!(o.sp&&cur.sprites&&cur.sprites[o.sp]);}
function stop(){if(ctrl){ctrl.stop();ctrl=null;}}
function showList(){
stop();$("ed").style.display="none";$("list").style.display="block";
$("pl").innerHTML=P.map(function(p,i){return '<div class="card"><span data-o="'+i+'">'+esc(p.name)+'</span><button class="btn g" data-d="'+i+'">Sil</button></div>';}).join("")||'<p style="opacity:.6">Henüz proje yok. "+ Yeni proje" ile başla.</p>';
}
$("pl").onclick=function(e){
var x=e.target.dataset;
if(x.o!=null)openP(+x.o);
else if(x.d!=null){if(confirm("Bu proje silinsin mi?")){P.splice(+x.d,1);sv();showList();}}
};
$("new").onclick=function(){
P.unshift({id:Date.now().toString(36),name:"Yeni proje",bg:"#1e3a8a",nid:2,nsp:1,sprites:{},objects:[{id:1,e:"⭐",x:50,y:50,s:20,r:0,drag:false}],rules:[{when:{t:"tap",o:1},if:{t:"none",op:">",n:0},do:[{t:"jump",o:1,v:1,v2:0}]}]});
sv();openP(0);
};
$("home").onclick=function(){location.href="/";};
$("back").onclick=function(){showList();};
$("pub").onclick=function(){alert("Yayınlama bir sonraki adımda eklenecek.");};
$("mode").onclick=function(){mode=mode=="edit"?"play":"edit";if(mode=="play"&&document.activeElement)document.activeElement.blur();modeBtn();stage();};
function modeBtn(){$("mode").textContent=mode=="edit"?"▶ Oyna":"✎ Düzenle";$("ed").classList.toggle("lock",mode=="play");}
function openP(i){
cur=P[i];cur.sprites=cur.sprites||{};cur.nsp=cur.nsp||1;
cur.rules.forEach(fix);
sel=cur.objects.length?cur.objects[0].id:null;mode="edit";tab="obj";
$("list").style.display="none";$("ed").style.display="flex";
$("pn").textContent=cur.name;modeBtn();stage();panel();
}
function stage(){
stop();var box=$("stage");
if(mode=="play")ctrl=GemmaEngine.run(box,cur);
else ctrl=GemmaEngine.run(box,cur,{edit:1,sel:sel,
onselect:function(id){sel=id;if(ctrl)ctrl.select(id);panel();},
onedit:function(id,t){var o=fo(id);if(!o)return;o.tx=t;sv();panel();},
onmove:function(id,x,y){var o=fo(id);if(!o)return;o.x=Math.round(x);o.y=Math.round(y);sv();panel();}});
}
function sl(a,v,at){return '<select '+at+'>'+a.map(function(x){return '<option value="'+x[0]+'"'+(x[0]==v?" selected":"")+'>'+x[1]+'</option>';}).join("")+'</select>';}
function ob(v,at){return sl(cur.objects.map(function(o){return [o.id,(isSp(o)?"🖼️":o.tx!=null?o.tx.slice(0,8):o.e)+" "+o.id];}),v,at);}
function nm(v,at){return '<input type="number" value="'+v+'" '+at+'>';}
function rw(l,c){return '<div class="row"><label>'+l+'</label>'+c+'</div>';}
function fix(r){
var f=cur.objects[0]?cur.objects[0].id:0;
r.when=r.when||{t:"start"};var w=r.when;
if(!fo(w.o))w.o=f;
if(!fo(w.o2))w.o2=cur.objects[1]?cur.objects[1].id:f;
if(w.sec==null)w.sec=1;
r.if=r.if||{t:"none",op:">",n:0};
if(!Array.isArray(r.do))r.do=r.do?[r.do]:[];
r.do.forEach(function(a){if(!fo(a.o))a.o=f;if(a.v==null)a.v=1;if(a.v2==null)a.v2=0;});
}
function actH(d,i,j){
var a='data-r="'+i+'" data-ai="'+j+'" data-p=';
var h='<div class="act">'+rw("Eylem",sl(DO,d.t,a+'"t"'));
if(OBJ.indexOf(d.t)>-1)h+=rw("Hangisi",ob(d.o,a+'"o"'));
if(d.t=="move")h+=rw("Sağa(+) Sola(−)",nm(d.v,a+'"v"'))+rw("Aşağı(+) Yukarı(−)",nm(d.v2,a+'"v2"'));
else if(d.t=="goto")h+=rw("Sol-sağ (0-100)",nm(d.v,a+'"v"'))+rw("Yukarı-aşağı",nm(d.v2,a+'"v2"'));
else if(d.t=="forward")h+=rw("Adım",nm(d.v,a+'"v"'));
else if(d.t=="rotate")h+=rw("Derece",nm(d.v,a+'"v"'));
else if(d.t=="grow")h+=rw("Yüzde",nm(d.v,a+'"v"'));
else if(d.t=="score"||d.t=="life")h+=rw("Sayı",nm(d.v,a+'"v"'));
return h+'<button class="btn g sm" data-dar="'+i+'" data-dai="'+j+'">Eylemi sil</button></div>';
}
function ruleH(r,i){
fix(r);var w=r.when,c=r.if,a='data-r="'+i+'" data-p=';
var h='<div class="rule"><div class="rt">Kural '+(i+1)+'</div>'+rw("Ne zaman",sl(WH,w.t,a+'"w.t"'));
if(w.t=="tap"||w.t=="edge")h+=rw("Hangisi",ob(w.o,a+'"w.o"'));
if(w.t=="touch")h+=rw("Bu nesne",ob(w.o,a+'"w.o"'))+rw("Buna değince",ob(w.o2,a+'"w.o2"'));
if(w.t=="every"||w.t=="after")h+=rw("Saniye",nm(w.sec,a+'"w.sec"'));
h+=rw("Şart",sl(CD,c.t,a+'"c.t"'));
if(c.t!="none")h+=rw("Şöyleyse",sl(OP,c.op,a+'"c.op"'))+rw("Sayı",nm(c.n,a+'"c.n"'));
h+='<div class="hint">Ne olsun:</div>';
r.do.forEach(function(d,j){h+=actH(d,i,j);});
return h+'<div style="margin-top:10px;display:flex;gap:8px"><button class="btn g" data-na="'+i+'">+ Eylem ekle</button><button class="btn g" data-dr="'+i+'">Kuralı sil</button></div></div>';
}
function panel(){
document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab==tab);});
var h="";
if(tab=="obj"){
h+=rw("İsim",'<input type="text" data-g="name" maxlength="30" value="'+esc(cur.name)+'">')+rw("Arka plan",'<input type="color" data-g="bg" value="'+cur.bg+'">');
h+='<button class="btn big" data-draw="new">✏️ Yeni karakter çiz</button>';
h+='<button class="btn big g" data-addtext="1">🔤 Yazı ekle</button>';
h+='<p class="hint">Hazır emoji (hızlı ekle):</p><div class="emo">'+EM.map(function(e){return '<button data-a="'+e+'">'+e+'</button>';}).join("")+'</div>';
h+='<p class="hint">Sahnedeki nesneler (sahnede sürükleyerek de taşıyabilirsin):</p><div class="emo">'+cur.objects.map(function(o){return '<button class="'+(o.id==sel?"on":"")+'" data-s="'+o.id+'">'+(isSp(o)?'<img src="'+cur.sprites[o.sp]+'" style="width:30px;height:30px;display:block">':o.tx!=null?'<span style="font-size:16px;font-weight:800">'+esc(o.tx.slice(0,6))+'</span>':o.e)+'</button>';}).join("")+'</div>';
var o=fo(sel);
if(o){
h+='<div class="rule">'+[["x","Sol-sağ (0-100)"],["y","Yukarı-aşağı (0-100)"],["s","Boyut"],["r","Dönüş (derece)"]].map(function(f){return rw(f[1],'<input type="number" data-f="'+f[0]+'" value="'+o[f[0]]+'">');}).join("")+rw("Sürüklensin",'<input type="checkbox" data-f="drag"'+(o.drag?" checked":"")+'>')+rw("Başta gizli",'<input type="checkbox" data-f="hide"'+(o.hide?" checked":"")+'>');
if(o.tx!=null)h+=rw("Yazı",'<input type="text" data-f="tx" maxlength="40" value="'+esc(o.tx)+'">')+rw("Yazı rengi",'<input type="color" data-f="c" value="'+(o.c||"#ffffff")+'">');
if(isSp(o))h+='<button class="btn g" data-draw="edit" style="margin-right:8px">✏️ Çizimi düzenle</button>';
h+='<button class="btn g" data-del="1">Nesneyi sil</button></div>';
}
}else{
h+=cur.rules.map(ruleH).join("")+'<button class="btn" data-nr="1">+ Kural ekle</button>';
}
$("panel").innerHTML=h;
}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;panel();};});
$("panel").onclick=function(e){
var d=e.target.closest("button");if(!d)return;var x=d.dataset;
if(x.draw){openSp(x.draw=="edit"&&fo(sel)?fo(sel).sp:null);return;}
if(x.addtext){var o={id:cur.nid++,tx:"Yazı",c:"#ffffff",x:50,y:50,s:8,r:0,drag:false};cur.objects.push(o);sel=o.id;}
else if(x.a){var o={id:cur.nid++,e:x.a,x:50,y:50,s:20,r:0,drag:false};cur.objects.push(o);sel=o.id;}
else if(x.s){sel=+x.s;}
else if(x.del){cur.objects=cur.objects.filter(function(o){return o.id!=sel;});sel=cur.objects.length?cur.objects[0].id:null;}
else if(x.nr){var f=cur.objects[0]?cur.objects[0].id:0;cur.rules.push({when:{t:"tap",o:f},if:{t:"none",op:">",n:0},do:[{t:"score",o:f,v:1,v2:0}]});}
else if(x.dr){cur.rules.splice(+x.dr,1);}
else if(x.na){var f2=cur.objects[0]?cur.objects[0].id:0;cur.rules[+x.na].do.push({t:"score",o:f2,v:1,v2:0});}
else if(x.dar!=null){cur.rules[+x.dar].do.splice(+x.dai,1);}
else return;
sv();stage();panel();
};
$("panel").onchange=function(e){
var t=e.target,x=t.dataset,r;
if(x.f){var o=fo(sel);o[x.f]=t.type=="checkbox"?t.checked:x.f=="tx"?(t.value||"Yazı"):x.f=="c"?t.value:+t.value;}
else if(x.g){cur[x.g]=t.value;$("pn").textContent=cur.name;}
else if(x.p){
r=cur.rules[+x.r];
if(x.ai!=null){var a=r.do[+x.ai];a[x.p]=x.p=="t"?t.value:+t.value;}
else{var k=x.p.split("."),g=k[0]=="w"?r.when:r.if;g[k[1]]=(k[1]=="t"||k[1]=="op")?t.value:+t.value;}
}else return;
sv();stage();if(x.p&&/(^|\.)t$/.test(x.p))panel();
};

/* ---- Çizim editörü ---- */
var cv=$("cv"),cx=cv.getContext("2d"),tool="pen",hist=[],snap=null,st=null,spTarget=null;
var TOOLS=[["pen","✏️ Kalem"],["eraser","🧽 Silgi"],["fill","🪣 Boya"],["line","╱ Çizgi"],["circle","◯ Daire"],["rect","▢ Kare"],["rrect","▢ Yuvarlak kare"]];
var PAL=["#000000","#ffffff","#ff3b5c","#ff9500","#ffd60a","#34c759","#00c7be","#0a84ff","#5e5ce6","#bf5af2","#a2845e","#8e8e93"];
function toolBtns(){$("tb").innerHTML=TOOLS.map(function(t){return '<button data-tool="'+t[0]+'" class="'+(t[0]==tool?"on":"")+'">'+t[1]+'</button>';}).join("");}
toolBtns();
$("tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;tool=b.dataset.tool;toolBtns();};
$("pal").innerHTML=PAL.map(function(c){return '<button data-c="'+c+'" style="background:'+c+'"></button>';}).join("");
$("pal").onclick=function(e){var b=e.target.closest("button");if(b)$("co").value=b.dataset.c;};
$("sz").oninput=function(){$("szv").textContent=this.value;};
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*128,y:(e.clientY-r.top)/r.height*128};}
function pushH(){hist.push(cx.getImageData(0,0,128,128));if(hist.length>25)hist.shift();}
function setup(){var c=$("co").value,s=+$("sz").value;cx.globalCompositeOperation=tool=="eraser"?"destination-out":"source-over";cx.strokeStyle=c;cx.fillStyle=c;cx.lineWidth=s;cx.lineCap="round";cx.lineJoin="round";return s;}
function stroke(a,b){var s=setup();cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();if(a.x==b.x&&a.y==b.y){cx.beginPath();cx.arc(a.x,a.y,s/2,0,7);cx.fill();}}
function rr(x,y,w,h,r){cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function shape(a,b){
setup();var x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y),fl=$("fl").checked;
cx.beginPath();
if(tool=="line"){cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();return;}
if(tool=="circle")cx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);
else if(tool=="rect")cx.rect(x,y,w,h);
else rr(x,y,w,h,Math.min(w,h)*0.25);
if(fl)cx.fill();else cx.stroke();
}
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function flood(px,py){
var W=128,sx=Math.floor(px),sy=Math.floor(py);if(sx<0||sy<0||sx>=W||sy>=W)return;
var id=cx.getImageData(0,0,W,W),d=id.data,i0=(sy*W+sx)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=rgb($("co").value);
function near(i,q){return Math.abs(d[i]-q[0])+Math.abs(d[i+1]-q[1])+Math.abs(d[i+2]-q[2])+Math.abs(d[i+3]-q[3])<60;}
if(t[3]==255&&near(i0,c))return;
var seen=new Uint8Array(W*W),stack=[sy*W+sx];
while(stack.length){
var p=stack.pop();if(seen[p])continue;seen[p]=1;
var i=p*4;if(!near(i,t))continue;
d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
var x=p%W,y=(p-x)/W;
if(x>0)stack.push(p-1);if(x<W-1)stack.push(p+1);if(y>0)stack.push(p-W);if(y<W-1)stack.push(p+W);
}
cx.putImageData(id,0,0);
}
cv.onpointerdown=function(e){
e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}
var p=pos(e);pushH();
if(tool=="fill"){flood(p.x,p.y);return;}
st=p;snap=cx.getImageData(0,0,128,128);
if(tool=="pen"||tool=="eraser")stroke(p,p);
};
cv.onpointermove=function(e){
if(!st)return;var p=pos(e);
if(tool=="pen"||tool=="eraser"){stroke(st,p);st=p;}
